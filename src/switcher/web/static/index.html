<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Eufy NVR Gateway</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tiles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-mark" id="brandMark"></span><h1>Eufy NVR Gateway</h1></div>
  <div class="top-actions">
    <span id="updatePill"></span>
    <div id="connection" aria-live="polite"><span class="pill wait"><span class="dot"></span>Connecting…</span></div>
    <button type="button" class="icon-button" id="theme"></button>
    <button type="button" class="icon-button" id="signout" hidden aria-label="Sign out" title="Sign out"></button>
  </div>
</header>

<main>
  <div id="updateBanner"></div>
  <section id="login" class="panel login" hidden aria-labelledby="loginTitle">
    <h2 id="loginTitle">eufy login needs your attention</h2>
    <p class="muted" id="loginText"></p>
    <img id="captcha" alt="captcha" hidden>
    <form id="loginForm" class="row">
      <label class="visually-hidden" for="code">Code</label>
      <input id="code" autocomplete="one-time-code" placeholder="Code" required>
      <button class="action primary">Submit</button>
      <button type="button" class="action" id="retrigger">Send a new code</button>
    </form>
    <p id="loginMsg" class="muted" aria-live="polite"></p>
  </section>

  <section aria-labelledby="camerasTitle">
    <h2 id="camerasTitle" class="visually-hidden">Cameras</h2>
    <div id="cams" class="grid"></div>
    <p id="noCams" class="panel muted" hidden>No cameras yet. Log in, then add them to <code>config.json</code> from the devices below and restart the container.</p>
  </section>

  <details id="devicesPanel" class="panel devices">
    <summary>Devices on your eufy account <span id="devicesSummary" class="muted"></span></summary>
    <div class="scroll">
      <table>
        <thead><tr><th>Device</th><th>Serial</th><th>Battery</th><th>Camera</th></tr></thead>
        <tbody id="devices"><tr><td colspan="4" class="muted">Available after login.</td></tr></tbody>
      </table>
    </div>
  </details>
</main>
<footer class="foot" id="footer"></footer>
<script type="module" src="app.js"></script>
</body>
</html>
