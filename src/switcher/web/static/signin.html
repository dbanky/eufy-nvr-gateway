<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sign in · Eufy NVR Gateway</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="signin-page">
<header class="top">
  <div class="brand"><span class="brand-mark" id="brandMark"></span><h1>Eufy NVR Gateway</h1></div>
  <div class="top-actions"><button type="button" class="icon-button" id="theme"></button></div>
</header>
<main>
  <form id="signin" class="panel signin" novalidate>
    <h2>Sign in</h2>
    <p class="muted">The login is set under <code>"web"</code> in <code>config.json</code>.</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p id="signinMsg" class="signin-msg" role="alert"></p>
    <button class="action primary">Sign in</button>
  </form>
</main>
<script type="module" src="signin.js"></script>
</body>
</html>
