# eufy-nvr-gateway — example Compose file (also works as a Synology Container Manager project).
#
#   1. Set EUFY_EMAIL / EUFY_PASSWORD / EUFY_COUNTRY below (a separate eufy account is recommended).
#   2. docker compose up -d   — then open http://<host>:8099 and log in.
#   3. Put the camera list in ./data/config.json (start from examples/config.example.json) and restart.
services:
  eufy-nvr-gateway:
    image: dbanky/eufy-nvr-gateway:latest   # or ghcr.io/dbanky/eufy-nvr-gateway:latest
    # or build it yourself from this repository:
    # build: https://github.com/dbanky/eufy-nvr-gateway.git
    container_name: eufy-nvr-gateway
    restart: unless-stopped
    # Host networking: NVRs and players reach the RTSP streams directly on the host's address.
    network_mode: host
    environment:
      EUFY_EMAIL: "you@example.com"
      EUFY_PASSWORD: "your-eufy-password"
      EUFY_COUNTRY: "GB"            # two-letter country the eufy account was registered in, e.g. GB, DE, US
      TZ: "Europe/London"
    volumes:
      - ./data:/data                # config.json (cameras), eufy login session, last frames
