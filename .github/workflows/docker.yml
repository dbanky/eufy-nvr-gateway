# Builds the image for amd64 + arm64 and publishes it to Docker Hub and the GitHub Container Registry
# when a GitHub release is published (tag v1.2.3):
#   <user>/eufy-nvr-gateway:1.2.3, :1.2, :latest
#   ghcr.io/<owner>/eufy-nvr-gateway:...        (same tags)
# Pre-releases get only their version tag, not :latest.
# Pull requests and manual runs are built but not published.
#
# Docker Hub needs, in the repository settings (Secrets and variables → Actions):
#   variable DOCKERHUB_USERNAME   the Docker Hub user or organisation
#   secret   DOCKERHUB_TOKEN      a personal access token with Read, Write, Delete scope
#                                 (Delete is required to update the description on Docker Hub)
# Without the variable, Docker Hub is skipped and only GHCR is published.
name: Docker image

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PUBLISH: ${{ github.event_name == 'release' }}   # only releases publish
  STABLE: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
  DOCKERHUB: ${{ vars.DOCKERHUB_USERNAME != '' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Syntax check
        run: node --check src/start.mjs && node --check src/switcher.mjs && node --check src/web.mjs

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1   # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6   # v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6   # v4.7.0
        if: env.PUBLISH == 'true' && env.DOCKERHUB == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6.2.0
        with:
          images: |
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/eufy-nvr-gateway,enable=${{ env.DOCKERHUB }}
            ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ env.STABLE }}
            type=sha,format=short

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep the Docker Hub page in sync with README.md (relative links made absolute).
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa   # v5.0.0
        if: env.STABLE == 'true' && env.DOCKERHUB == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/eufy-nvr-gateway
          short-description: ${{ github.event.repository.description }}
          enable-url-completion: true
